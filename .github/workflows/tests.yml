name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # No network, no keys: the suite must pass on a machine with neither.
        run: pytest -q --cov=src --cov-report=term-missing

      - name: The examples must still clear the project's own bar
        run: python scripts/build_examples.py --check

      - name: A fully offline dry run must complete
        env:
          LLM_PROVIDER: stub
          EMAIL_PROVIDER: console
          EMAIL_FROM: editor@example.com
          EMAIL_TO: reader@example.com
          DATABASE_PATH: /tmp/ci-check.db
        run: python -m src.main run --dry-run --offline --force --allow-skip
